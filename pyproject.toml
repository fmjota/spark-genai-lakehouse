[project]
name = "genai-etl"
version = "0.1.0"
description = "ETL distribuido a gran escala enriquecido con GenAI: modelos preentrenados de Hugging Face en UDFs de Spark optimizadas estructuran texto no estructurado (NER/sentimiento) a escala, con confianza y persistencia lakehouse Delta. Núcleo reutilizable multi-dominio (salud/educación/banca)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Felipe Mjaque" }]
dependencies = [
    "pyspark>=4.0,<4.1",
    "delta-spark>=4.0,<4.1",
    "transformers>=4.44",
    "torch>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pandera>=0.20",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "rich>=13",
]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "ruff>=0.4",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genai_etl"]

# torch desde el índice de ruedas CPU: evita descargar el build CUDA (~GB) en laptop/CI.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
